<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobby Boss Trail Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  /* Leaflet essential styles (inlined) */
  .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
  .leaflet-container{overflow:hidden;font:12px/1.5 "Helvetica Neue",Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent;background:#ddd}
  .leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
  .leaflet-tile{filter:inherit;visibility:hidden}
  .leaflet-tile-loaded{visibility:inherit}
  .leaflet-zoom-animated{-webkit-transform-origin:0 0;transform-origin:0 0}
  .leaflet-tile-container{pointer-events:none}
  .leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform;-webkit-transition:-webkit-transform .25s cubic-bezier(0,0,.25,1);transition:transform .25s cubic-bezier(0,0,.25,1)}
  .leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{-webkit-transition:none;transition:none}
  .leaflet-interactive{cursor:pointer}
  .leaflet-grab{cursor:grab}
  .leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
  .leaflet-control-zoom{margin:10px}
  .leaflet-control-zoom a{width:30px;height:30px;line-height:30px;display:block;text-align:center;text-decoration:none;font:bold 18px "Lucida Console",Monaco,monospace}
  .leaflet-touch .leaflet-control-zoom a{width:36px;height:36px;line-height:36px;font-size:20px}
  .leaflet-marker-icon,.leaflet-marker-shadow{display:block}
  .leaflet-container a{color:#0078A8}
  .leaflet-popup-pane{z-index:700}
  .leaflet-map-pane svg,.leaflet-map-pane canvas{position:relative}
  .leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;float:left;clear:both}
  .leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
  .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
  .leaflet-top .leaflet-control,.leaflet-bottom .leaflet-control{pointer-events:auto}
  .leaflet-right .leaflet-control{float:right;margin-right:10px}
  .leaflet-control-zoom{border-radius:5px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,0.25)}
  .leaflet-control-zoom a{background:var(--panel-bg,#fff);color:#333;border-bottom:1px solid #ccc}
  .leaflet-control-zoom a:last-child{border-bottom:none}
  .leaflet-control-zoom a:hover{background:var(--bg,#f4f4f4)}
  .leaflet-control-attribution{background:rgba(255,255,255,.7);margin:0;padding:0 5px;font-size:10px}
  .leaflet-control-attribution a{text-decoration:none}

  :root {
    --bg: #f7f6f3;
    --fg: #2a2a2a;
    --panel-bg: #ffffff;
    --accent: #9a6b3a;
    --accent-hover: #7d5630;
    --muted: #888;
    --muted-light: #bbb;
    --border: #e5e3de;
    --overlay: rgba(0, 0, 0, 0.82);
    --marker-fill: #9a6b3a;
    --marker-stroke: #ffffff;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    padding: 0 !important;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414;
      --fg: #e0ddd6;
      --panel-bg: #1c1c1c;
      --accent: #c8965e;
      --accent-hover: #daa87a;
      --muted: #888;
      --muted-light: #555;
      --border: #333;
      --overlay: rgba(0, 0, 0, 0.88);
      --marker-fill: #c8965e;
      --marker-stroke: #1c1c1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414;
    --fg: #e0ddd6;
    --panel-bg: #1c1c1c;
    --accent: #c8965e;
    --accent-hover: #daa87a;
    --muted: #888;
    --muted-light: #555;
    --border: #333;
    --overlay: rgba(0, 0, 0, 0.88);
    --marker-fill: #c8965e;
    --marker-stroke: #1c1c1c;
    color-scheme: dark;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }

  * { box-sizing: border-box; }

  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .leaflet-tile-pane {
    filter: saturate(0.15) brightness(1.08) contrast(0.95);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .leaflet-tile-pane {
      filter: saturate(0.1) brightness(0.55) invert(1) hue-rotate(180deg) contrast(0.9);
    }
  }
  :root[data-theme="dark"] .leaflet-tile-pane {
    filter: saturate(0.1) brightness(0.55) invert(1) hue-rotate(180deg) contrast(0.9);
  }

  .title-bar {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    z-index: 1001;
    display: flex;
    align-items: center;
    padding: 16px 24px;
    pointer-events: none;
  }

  .title-bar img {
    height: 40px;
    width: auto;
    pointer-events: auto;
    filter: drop-shadow(0 1px 8px rgba(255,255,255,0.7));
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .title-bar img {
      filter: invert(1) drop-shadow(0 1px 8px rgba(0,0,0,0.7));
    }
  }
  :root[data-theme="dark"] .title-bar img {
    filter: invert(1) drop-shadow(0 1px 8px rgba(0,0,0,0.7));
  }

  .map-hint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    background: var(--panel-bg);
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 8px 20px;
    border-radius: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }
  .map-hint.hidden { opacity: 0; }

  /* ---- Full-screen modal ---- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    position: relative;
    display: flex;
    width: 100%;
    max-width: 1200px;
    max-height: calc(100vh - 48px);
    background: var(--panel-bg);
    border-radius: 12px;
    overflow: hidden;
    transform: scale(0.92) translateY(20px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }
  .modal-overlay.active .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-image {
    flex: 1 1 60%;
    min-width: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .modal-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    max-height: calc(100vh - 48px);
  }

  .modal-details {
    flex: 0 0 340px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 36px 32px 32px;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2001;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--border);
    color: var(--fg);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--muted-light); }

  .modal-details .painting-title {
    font-family: var(--font-display);
    font-size: 1.65rem;
    font-weight: 400;
    margin: 0 0 8px;
    line-height: 1.2;
    text-wrap: balance;
  }

  .modal-details .painting-location {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 28px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .painting-location svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .modal-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .meta-label {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-light);
  }
  .meta-value {
    font-size: 0.88rem;
    color: var(--fg);
  }

  .modal-description {
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
    flex: 1;
  }

  .modal-cta {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .modal-cta:hover { background: var(--accent-hover); }

  /* ---- Mobile modal ---- */

  @media (max-width: 768px) {
    .modal-overlay { padding: 0; }
    .modal {
      flex-direction: column;
      max-width: 100%;
      max-height: 100%;
      height: 100%;
      border-radius: 0;
    }
    .modal-image {
      flex: 0 0 auto;
      max-height: 50vh;
    }
    .modal-image img {
      max-height: 50vh;
      object-fit: cover;
      object-position: center;
    }
    .modal-details {
      flex: 1 1 auto;
      min-height: 0;
      padding: 24px 20px 32px;
    }
    .modal-details .painting-title { font-size: 1.35rem; }
    .title-bar img { height: 30px; }
  }

  @media (max-width: 768px) {
    .modal-details { flex-basis: auto; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="title-bar">
  <img src="logo.webp" alt="Bobby Boss Art" />
</div>

<div class="map-hint" id="mapHint">Click a trail marker to explore a painting</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-image">
      <img id="modalImage" src="" alt="" />
    </div>
    <div class="modal-details">
      <h2 class="painting-title" id="modalTitle"></h2>
      <p class="painting-location" id="modalLocation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="modalLocationText"></span>
      </p>
      <div class="modal-meta" id="modalMeta"></div>
      <p class="modal-description" id="modalDescription"></p>
      <a class="modal-cta" href="https://bobbybossart.com/contact/" target="_blank" rel="noopener">
        Inquire About This Painting
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
const PAINTINGS = [
  {
    id: 1,
    title: "The Morro Session",
    location: "Morro Rock, Morro Bay",
    lat: 35.3711,
    lng: -120.8685,
    medium: "Oil on Canvas",
    size: '36" x 48"',
    year: "2021",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/The-Morro-Session-Bobby-Boss-36-x-48-copy-2.jpg",
    description: "A golden hour session at the iconic Morro Rock. The warm light catches the face of the rock while a lone surfer finds one more wave before dark. This painting captures the essence of Central Coast surf culture — the quiet communion between ocean, stone, and rider."
  },
  {
    id: 2,
    title: "One More at Molera",
    location: "Andrew Molera State Park, Big Sur",
    lat: 36.2870,
    lng: -121.8530,
    medium: "Oil on Canvas",
    size: '18" x 36"',
    year: "2021",
    image: "https://bobbybossart.com/wp-content/uploads/2021/01/One-More-at-Molera-Bobby-Boss-18-x-36.jpg",
    description: "The rugged coastline at Andrew Molera where the Big Sur mountains meet the sea. Painted from the bluff trail overlooking the river mouth break — a place where the scale of nature makes everything else fall away."
  },
  {
    id: 3,
    title: "Old Creek",
    location: "Old Creek, Cayucos",
    lat: 35.4600,
    lng: -120.8950,
    medium: "Acrylic on Canvas",
    size: '16" x 20"',
    year: "2021",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/Old-Creek-Inspiration-Painting-Bobby-Boss.jpg",
    description: "The quiet stretch of Old Creek near Cayucos where the coastal oaks frame the rolling hills. Painted from a spot along the trail where the creek opens to a view of golden grasslands against the Pacific sky."
  },
  {
    id: 4,
    title: "The Bench",
    location: "Shell Beach Bluffs, Pismo Beach",
    lat: 35.1635,
    lng: -120.6920,
    medium: "Acrylic on Wood",
    size: '12" x 12"',
    year: "2021",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/The-Bench-Painting-Bobby-Boss-12-x-12.jpg",
    description: "A quiet overlook at the Shell Beach bluffs — the kind of bench you find along the coastal trail where someone decided this was the view worth sitting with. The painting captures that pause between movement and stillness."
  },
  {
    id: 5,
    title: "Spyglass",
    location: "Shell Beach Road, Shell Beach",
    lat: 35.1545,
    lng: -120.6830,
    medium: "Vinyl on Utility Box (Public Art)",
    size: "Utility Box Wrap",
    year: "2021",
    image: "https://bobbybossart.com/wp-content/uploads/2021/08/IMG_0393-1-scaled.jpg",
    description: "Part of the Shell Beach Road utility box project. This piece brings Bobby's coastal vision to the streetscape at the intersection of Shell Beach Road and Placentia — a daily reminder of the beauty just beyond the bluffs."
  },
  {
    id: 6,
    title: "Madonna Oak Grove",
    location: "Johnson Ave & Ella St, San Luis Obispo",
    lat: 35.2560,
    lng: -120.6750,
    medium: "Vinyl on Utility Box (SLO Box Art)",
    size: "Utility Box Wrap",
    year: "2018",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/IMG_8072-768x1024.jpg",
    description: "Bobby's contribution to the SLO Box Art Project — a painting of the ancient oaks studding the foothills of Madonna Mountain. The original painting was selected by the City of San Luis Obispo and vinyl-wrapped onto this utility box."
  },
  {
    id: 7,
    title: "Newport Pier Sunset",
    location: "Newport Beach Pier, Newport Beach",
    lat: 33.6069,
    lng: -117.9310,
    medium: "Oil on Wood",
    size: '30" x 60"',
    year: "2022",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/IMG_7223-1024x768.jpg",
    description: "A custom commission for a family in Southern California, this piece captures the warm glow of sunset light washing over Newport Pier. The painting was designed and installed in their beach home — a daily portal to golden hour."
  },
  {
    id: 8,
    title: "Morro Memory",
    location: "Morro Bay Estuary, Morro Bay",
    lat: 35.3530,
    lng: -120.8490,
    medium: "Acrylic on Surfboard",
    size: "9'6″ Longboard",
    year: "2024",
    image: "https://bobbybossart.com/wp-content/uploads/sb-instagram-feed-images/464296680_1699924280854817_6002155063637305127_nlow.webp",
    description: "A memorial commission painted on a beloved longboard. The view of Morro Rock from the estuary was chosen to honor its owner's deep love of the ocean. Every crack, pressure dent, and ding was preserved — the board tells the story of the man who rode it."
  },
  {
    id: 9,
    title: "Montana de Oro Bluffs",
    location: "Spooner's Cove, Montana de Oro",
    lat: 35.2725,
    lng: -120.8870,
    medium: "Oil on Canvas",
    size: '24" x 36"',
    year: "2023",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/IMG_7371-1024x786.jpg",
    description: "The dramatic sea cliffs and coves of Montana de Oro State Park — one of the most wild and untouched stretches of California coastline. Painted from the bluff trail above Spooner's Cove during a low-tide afternoon."
  },
  {
    id: 10,
    title: "Iceland Shelter",
    location: "Víkurfjara Beach, Iceland",
    lat: 63.4100,
    lng: -19.0200,
    medium: "Oil on Canvas",
    size: '18" x 24"',
    year: "2020",
    image: "https://bobbybossart.com/wp-content/uploads/2021/07/Iceland-Shelter-Painting-Bobby-Boss.jpg",
    description: "While most of Bobby's work lives on the Central Coast, his adventure-driven spirit occasionally takes him further afield. This piece captures a solitary shelter on Iceland's black sand coast — the raw power of a landscape shaped entirely by fire and ice."
  }
];

const markerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 44" width="36" height="44" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.3));cursor:pointer">
  <path d="M18 0C8.06 0 0 8.06 0 18c0 12.6 16.2 24.84 16.89 25.38a1.8 1.8 0 0 0 2.22 0C19.8 42.84 36 30.6 36 18 36 8.06 27.94 0 18 0z" fill="#9a6b3a"/>
  <circle cx="18" cy="17" r="9" fill="#fff" opacity="0.95"/>
  <path d="M14 20.5l-1.5-2.5h2l1.5-3.5 1.5 3.5h2L18 20.5M12.5 21h11" stroke="#9a6b3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M15 17l3-5 3 5" stroke="#9a6b3a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>`;

const trailIcon = L.divIcon({
  html: markerSvg,
  className: '',
  iconSize: [36, 44],
  iconAnchor: [18, 44],
  popupAnchor: [0, -48]
});

const map = L.map('map', {
  center: [35.30, -120.75],
  zoom: 10,
  zoomControl: false,
  attributionControl: true
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

PAINTINGS.forEach(painting => {
  const marker = L.marker([painting.lat, painting.lng], { icon: trailIcon }).addTo(map);
  marker.on('click', () => openModal(painting.id));
});

function openModal(paintingId) {
  const p = PAINTINGS.find(x => x.id === paintingId);
  if (!p) return;

  map.closePopup();

  document.getElementById('modalImage').src = p.image;
  document.getElementById('modalImage').alt = p.title;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalLocationText').textContent = p.location;
  document.getElementById('modalDescription').textContent = p.description;

  document.getElementById('modalMeta').innerHTML = `
    <div class="meta-item"><span class="meta-label">Medium</span><span class="meta-value">${p.medium}</span></div>
    <div class="meta-item"><span class="meta-label">Size</span><span class="meta-value">${p.size}</span></div>
    <div class="meta-item"><span class="meta-label">Year</span><span class="meta-value">${p.year}</span></div>
    <div class="meta-item"><span class="meta-label">Location</span><span class="meta-value">${p.location.split(',')[0]}</span></div>
  `;

  document.getElementById('modalOverlay').classList.add('active');
  map.flyTo([p.lat, p.lng], 13, { duration: 1.2 });
  document.getElementById('mapHint').classList.add('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  map.flyTo([35.30, -120.75], 10, { duration: 1 });
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

setTimeout(() => { document.getElementById('mapHint').classList.add('hidden'); }, 5000);
</script>
</body>
</html>
